components:
  schemas:
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        description:
          type: string
        author:
          type: integer
          readOnly: true
        issue:
          type: integer
          readOnly: true
        created_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_time
      - description
      - id
      - issue
    Contributor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        project:
          type: integer
        created_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_time
      - id
      - project
      - user
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        tag:
          $ref: '#/components/schemas/TagEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        project:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
        created_time:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_time
      - description
      - id
      - priority
      - project
      - tag
      - title
    PaginatedCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PaginatedContributorList:
      type: object
      required:
